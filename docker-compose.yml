services:
  postgres:
    image: postgres:16
    container_name: insightpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: insightpulse
      POSTGRES_PASSWORD: insightpulse
      POSTGRES_DB: insightpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
